name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  engine:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run validate
      - run: node --check dist/app.js
      - run: node --check dist/sw.js
  browser:
    # Match the pinned browser runner's supported OS instead of a moving latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Install the optional browser test runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Run isolated browser acceptance
        run: npm run test:browser
